<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>clauditor</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👁️</text></svg>">
</head>
<body>
<header id="topbar">
  <h1>clauditor</h1>
  <div id="counters">
    <button class="counter needs" data-filter="needs"><span class="n">0</span> need input</button>
    <button class="counter working" data-filter="working"><span class="n">0</span> working</button>
    <button class="counter done" data-filter="done"><span class="n">0</span> done</button>
  </div>
</header>
<div id="stale" hidden>⚠ disconnected — stale since <span id="stale-secs">0</span>s</div>
<main id="board" aria-live="polite">
  <p class="empty">connecting…</p>
</main>

<div id="drawer-backdrop" hidden></div>
<aside id="drawer" hidden aria-label="session detail">
  <div id="drawer-head">
    <span id="drawer-chip"></span>
    <h2 id="drawer-title"></h2>
    <button id="drawer-close" aria-label="close">✕</button>
  </div>
  <dl id="drawer-meta"></dl>
  <div id="drawer-copy"></div>
  <div id="drawer-actions" hidden></div>
  <div id="drawer-logs-head">
    <h3>recent output</h3>
    <button id="logs-refresh">refresh</button>
  </div>
  <pre id="drawer-logs">…</pre>
</aside>

<button id="fab" hidden>+ dispatch <span id="fab-working"></span></button>

<div id="sheet-backdrop" hidden></div>
<aside id="sheet" hidden aria-label="dispatch">
  <div id="drawer-head">
    <h2>dispatch background session</h2>
    <button id="sheet-close" aria-label="close">✕</button>
  </div>
  <form id="dispatch-form">
    <label>repo
      <select id="d-repo" required></select>
    </label>
    <label>worktree
      <select id="d-worktree"></select>
    </label>
    <div id="d-new-wt" hidden>
      <label>new branch <input id="d-branch" placeholder="feat/thing" pattern="[A-Za-z0-9._/-]+"></label>
      <label>base ref <input id="d-base" placeholder="(default: HEAD)"></label>
    </div>
    <label>prompt
      <textarea id="d-prompt" rows="4" required placeholder="What should this session do?"></textarea>
    </label>
    <details>
      <summary>options</summary>
      <label>name <input id="d-name" placeholder="(auto)"></label>
      <label>model <input id="d-model" placeholder="(default)"></label>
    </details>
    <p class="quota">⚡ <span id="sheet-working">0</span> session(s) already working — parallel sessions burn quota linearly</p>
    <button type="submit" id="d-submit">dispatch</button>
  </form>
</aside>

<div id="toast" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
